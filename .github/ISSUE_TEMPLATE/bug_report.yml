name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the app\n2. Import images\n3. ..."
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Landing page, Board and drag and drop, Image import, Export preview, Export download, Layouts or palettes, Offline or install, Other]
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
      placeholder: Chrome 130 on Android 15
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: Phone model or desktop
  - type: textarea
    id: shots
    attributes:
      label: Screenshots or screen recording
